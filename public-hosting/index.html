<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00a2e6" />
    <title>Whappy</title>
    <style>
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#f5fbfe;color:#07435c;font-family:Arial,sans-serif}.card{width:min(520px,calc(100% - 32px));padding:42px;border:1px solid #d9edf6;border-radius:28px;background:white;text-align:center;box-shadow:0 24px 70px rgba(0,126,179,.12)}.logo{width:72px;height:72px;margin:auto;display:block;border-radius:22px;box-shadow:0 14px 34px rgba(0,162,230,.22)}h1{margin:18px 0 6px;font-size:34px}p{margin:0;color:#68808a;line-height:1.6}.status{display:inline-flex;align-items:center;gap:7px;margin-top:22px;padding:9px 13px;border-radius:999px;background:#eaf8fe;color:#007daf;font-size:12px;font-weight:700}.status i{width:8px;height:8px;border-radius:50%;background:#00a2e6}
    </style>
  </head>
  <body><main class="card"><img class="logo" src="whappy-logo.svg" alt="Logo Whappy"/><h1>Whappy</h1><p>La plateforme est connectée à Firebase.<br/>La publication complète de l’application arrive ici.</p><span class="status"><i></i> Services Whappy opérationnels</span></main></body>
</html>
