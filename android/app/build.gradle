plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.whappy.chat"
    compileSdk 35

    defaultConfig {
        applicationId "com.whappy.chat"
        minSdk 26
        targetSdk 35
        versionCode 42
        versionName "1.7.1-native"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-test"
        }
        release {
            signingConfig signingConfigs.release
            // Keep the WebRTC/JNI runtime intact on Samsung, Xiaomi, Tecno,
            // Infinix and older Android devices. Reliability is more important
            // than a smaller download for the direct APK distribution.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.16.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-storage"
    implementation "com.google.firebase:firebase-messaging"
    implementation platform("androidx.compose:compose-bom:2025.04.01")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.6"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.emoji2:emoji2:1.5.0"
    implementation "androidx.camera:camera-core:1.4.2"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "com.google.guava:guava:33.4.8-android"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0"
    implementation "androidx.navigation:navigation-compose:2.9.0"
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2"
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
    implementation "com.google.zxing:core:3.5.4"
    implementation "io.github.webrtc-sdk:android:144.7559.09"
    // Tencent MMKV: fast C++/mmap storage for reliable local persistence.
    implementation "com.tencent:mmkv:2.4.1"
    testImplementation "junit:junit:4.13.2"
}
